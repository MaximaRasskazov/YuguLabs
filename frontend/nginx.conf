server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite assets: content-hashed filenames — cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: index.html никогда не кешируем — он содержит хеши ассетов
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # REST API → бэкенд
  location /api/ {
    # Загрузка фотографии профиля (multipart). Дефолт nginx — 1 МБ,
    # поднимаем под лимит бэкенда (MaxUploadBytes = 16 МБ + запас на
    # multipart-обвязку): сервер сам сожмёт даже 4K-снимок.
    client_max_body_size 20m;
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # WebSocket уведомлений
  location /ws/ {
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
